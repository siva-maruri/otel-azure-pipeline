name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OTELCOL_VERSION: "0.161.0"
      PROMETHEUS_VERSION: "3.5.0"
      NETPOL_ANALYZER_VERSION: "v1.4.4"
      KUBECONFORM_VERSION: "v0.8.0"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install bicep, otelcol-contrib and promtool
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          sudo install bicep /usr/local/bin/bicep
          curl -sSL "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz" \
            | tar xz otelcol-contrib
          sudo install otelcol-contrib /usr/local/bin/otelcol-contrib
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo install promtool /usr/local/bin/promtool
          pip install pyyaml

      - run: bash scripts/validate.sh

      - run: bash scripts/local_test.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install netpol-analyzer and kubeconform
        run: |
          go install "github.com/np-guard/netpol-analyzer/cmd/netpolicy@${NETPOL_ANALYZER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - run: bash scripts/policy_test.sh

      - run: shellcheck scripts/*.sh
