name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OTELCOL_VERSION: "0.161.0"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install bicep and otelcol-contrib
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          sudo install bicep /usr/local/bin/bicep
          curl -sSL "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz" \
            | tar xz otelcol-contrib
          sudo install otelcol-contrib /usr/local/bin/otelcol-contrib
          pip install pyyaml

      - run: bash scripts/validate.sh

      - run: bash scripts/local_test.sh

      - run: shellcheck scripts/*.sh
