# Overlay for a free-trial subscription: one small node, so the gateway has to fit in a
# fraction of it. Layered on top of gateway-values.yaml by scripts/deploy.sh when
# DEPLOY_PROFILE=trial. Everything else (mTLS, scrubbing, tail sampling) stays the same.
autoscaling:
  minReplicas: 1
  maxReplicas: 2

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    memory: 768Mi

# One replica can't satisfy "keep 2 available", and it would block node drains.
podDisruptionBudget:
  enabled: false
