# Router tier: the only thing apps and APIM talk to. Hashes trace ids across the gateway
# replicas so each trace lands on one gateway, which tail sampling depends on.
# Installed by scripts/deploy.sh as release "otel-router".

mode: deployment
# Stateless, so it can scale freely in both directions.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.161.0"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# From cert-manager (collector/certs.yaml): a client cert for the gateway hop, and a server
# cert for the receivers.
extraVolumes:
  - name: tls
    secret:
      secretName: otel-router-tls
  - name: server-tls
    secret:
      secretName: otel-router-server-tls
extraVolumeMounts:
  - name: tls
    mountPath: /etc/otel/tls
    readOnly: true
  - name: server-tls
    mountPath: /etc/otel/server-tls
    readOnly: true

# Internal load balancer on a fixed IP so APIM has a stable backend (routerIlbIp in Bicep).
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.20.3.250"

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    # TLS on both OTLP listeners. APIM validates the certificate against the CA it's given
    # on deploy (see scripts/deploy.sh); in-cluster apps trust the otel-ca-bundle ConfigMap.
    # reload_interval picks up cert-manager renewals without a restart.
    otlp:
      protocols:
        grpc:
          tls:
            cert_file: /etc/otel/server-tls/tls.crt
            key_file: /etc/otel/server-tls/tls.key
            min_version: "1.2"
            reload_interval: 24h
        http:
          tls:
            cert_file: /etc/otel/server-tls/tls.crt
            key_file: /etc/otel/server-tls/tls.key
            min_version: "1.2"
            reload_interval: 24h

  exporters:
    debug: null

    loadbalancing:
      routing_key: traceID
      protocol:
        otlp:
          tls:
            ca_file: /etc/otel/tls/ca.crt
            cert_file: /etc/otel/tls/tls.crt
            key_file: /etc/otel/tls/tls.key
            # Resolved endpoints are pod IPs; the gateway cert is issued for the service name.
            server_name_override: otel-gateway-headless.observability.svc.cluster.local
          sending_queue:
            enabled: true
            queue_size: 5000
      resolver:
        dns:
          hostname: otel-gateway-headless.observability.svc.cluster.local
          port: "4317"

    # Logs and metrics don't need trace affinity, so plain round-robin to the gateway.
    otlp_grpc/gateway:
      endpoint: otel-gateway-opentelemetry-collector.observability.svc.cluster.local:4317
      tls:
        ca_file: /etc/otel/tls/ca.crt
        cert_file: /etc/otel/tls/tls.crt
        key_file: /etc/otel/tls/tls.key

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter]
        exporters: [loadbalancing]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/gateway]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/gateway]
